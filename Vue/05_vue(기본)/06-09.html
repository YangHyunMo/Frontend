<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>06-08</title>
    <style>
      .btnColor {
        background-color: aqua;
        color: black;
      }
      .btnAlign {
        text-align: center;
        width: 120px;
      }
      .btnBorder {
        border: khaki dashed 1px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <button :class="{bColor:setColor,bLayout:setAlign,btnBorder:setBorder}">
        버튼1
      </button>
      <p>
        <input
          type="checkbox"
          v-model="btnStyle.btnColor"
          value="true"
        />색상<br />
        <input type="checkbox" v-model="btnStyle.btnAlign" value="true" />정렬,
        크기<br />
        <input
          type="checkbox"
          v-model="btnStyle.btnBorder"
          value="true"
        />테두리선
      </p>
      <button :class="btnStyle">버튼</button>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script type="text/javascript">
      const { createApp } = Vue;

      let vm = createApp({
        name: 'App',
        data() {
          return {
            btnStyle: {
              btnColor: false,
              btnAlign: false,
              btnBorder: false,
            },
          };
        },
      });
      vm.mount('#app');
    </script>
  </body>
</html>
