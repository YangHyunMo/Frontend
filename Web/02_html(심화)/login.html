<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
  </head>
  <body>
    <h1>login</h1>
    <form>
      <fieldset>
        <legend>로그인</legend>
        <table>
          <tr>
            <td>
              <label for="id">사용자 아이디</label>
            </td>
            <td>
              <input type="text" id="id" name="id" />
            </td>
          </tr>
          <tr>
            <td>
              <label for="password">비밀번호</label>
            </td>
            <td>
              <input type="password" id="password" name="password" />
            </td>
          </tr>
        </table>
        <input type="submit" />
      </fieldset>
    </form>
  </body>
</html>
