<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>join</title>
  </head>
  <body>
    <h1>join</h1>
    <form>
      <fieldset style="width: 400px">
        <legend>회원가입</legend>
        <table>
          <tr>
            <td>
              <label for="id"><b>사용자 ID</b></label>
            </td>
            <td><input type="text" id="id" name="id" /></td>
          </tr>
          <tr>
            <td>
              <label for="password"><b>비밀번호</b></label>
            </td>
            <td><input type="password" id="password" name="password" /></td>
          </tr>
          <tr>
            <td>
              <label for="check"><b>비밀번호 확인</b></label>
            </td>
            <td><input type="password" id="check" name="check" /></td>
          </tr>
          <tr>
            <td>
              <label for="name"><b>이름</b></label>
            </td>
            <td><input type="text" id="name" name="name" /></td>
          </tr>
          <tr>
            <td><b>성별</b></td>
            <td>
              <label for="man"></label>
              <input type="radio" id="man" name="gender" value="m" /> 남
              <label for="woman"></label>
              <input type="radio" id="woman" name="gender" value="w" /> 여
            </td>
          </tr>
          <tr>
            <td><b>취미</b></td>
            <td>
              <label for="soccer"></label>
              <input type="checkbox" id="soccer" name="sports" value="soc" />
              축구
              <label for="baseball"></label>
              <input type="checkbox" id="baseball" name="sports" value="base" />
              야구
              <label for="valleyball"></label>
              <input
                type="checkbox"
                id="volleyball"
                name="sports"
                value="vol"
              />
              배구
              <label for="basketball"></label>
              <input
                type="checkbox"
                id="basketball"
                name="sports"
                value="bas"
              />
              농구
            </td>
          </tr>
          <tr>
            <td>
              <label for="email"><b>email</b></label>
            </td>
            <td><input type="email" id="email" name="email" /></td>
          </tr>
          <tr>
            <td><b>역할</b></td>
            <td>
              <select>
                <option value="1">ADMIN</option>
                <option value="2">관리자</option>
                <option value="3">일반회원</option>
              </select>
            </td>
          </tr>
        </table>
        <button type="submit">확인</button>
        <button type="reset">다시쓰기</button>
      </fieldset>
    </form>
  </body>
</html>
